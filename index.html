let curType = '';
const grid = document.getElementById('grid');
const countrySel = document.getElementById('countrySel');
const catSel = document.getElementById('catSel');
const qInput = document.getElementById('qInput');
const shownCount = document.getElementById('shownCount');
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');

[...new Set(ITEMS.map(x => x.country).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'zh-Hant')).forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c; countrySel.appendChild(o);
});
[...new Set(ITEMS.map(x => x.category).filter(Boolean))].sort().forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o);
});

document.querySelectorAll('button[data-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('button[data-type]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curType = btn.dataset.type;
    render();
  });
});
countrySel.addEventListener('change', render);
catSel.addEventListener('change', render);
qInput.addEventListener('input', render);
document.getElementById('themeBtn').addEventListener('click', (e) => {
  document.body.classList.toggle('dark');
  e.target.textContent = document.body.classList.contains('dark') ? '☀️ 淺色模式' : '🌙 深色模式';
});
lb.addEventListener('click', () => lb.classList.remove('open'));

function render() {
  const c = countrySel.value;
  const cat = catSel.value;
  const q = qInput.value.trim().toLowerCase();
  const list = ITEMS.filter(it => {
    if (curType && it.type !== curType) return false;
    if (c && it.country !== c) return false;
    if (cat && it.category !== cat) return false;
    if (q) {
      const hay = `${it.name} ${it.country} ${it.category} ${it.coordinates}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  shownCount.textContent = `共 ${list.length} 張`;
  grid.innerHTML = '';
  for (const it of list) {
    const card = document.createElement('div'); card.className = 'card';
    const thumb = document.createElement('div'); thumb.className = 'thumb-wrap';
    const src = it.local_image || it.image_url;
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = src; img.alt = it.name || '';
    thumb.appendChild(img);
    thumb.addEventListener('click', () => { lbImg.src = src; lb.classList.add('open'); });
    const badge = document.createElement('span'); badge.className = 'badge';
    badge.textContent = (it.type === '蘑菇' ? '🍄 ' : '🌸 ') + (it.category || it.type);
    thumb.appendChild(badge);

    const info = document.createElement('div'); info.className = 'card-info';
    const ctag = document.createElement('div'); ctag.className = 'country-tag';
    ctag.textContent = `🌏 ${it.country || '未知'} · ${it.name || ''}`;
    const coordBtn = document.createElement('button'); coordBtn.className = 'coord-btn';
    coordBtn.innerHTML = `<span>📍 ${it.coordinates}</span><span>📋</span>`;
    coordBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(it.coordinates);
      coordBtn.innerHTML = `<span>✅ 已複製</span><span>${it.coordinates}</span>`;
      setTimeout(() => coordBtn.innerHTML = `<span>📍 ${it.coordinates}</span><span>📋</span>`, 1200);
    });
    const links = document.createElement('div'); links.className = 'links';
    const coords = (it.coordinates || '').replace(/\s+/g, '');
    const gmap = `https://www.google.com/maps?q=${coords}`;
    links.innerHTML = `<span>📅 ${(it.created_at || '').slice(0, 10)}</span><a href="${gmap}" target="_blank">🗺️ 導航</a>`;
    info.append(ctag, coordBtn, links);
    card.append(thumb, info);
    grid.appendChild(card);
  }
}
render();
</script>
